name: tests

# CI only. The site is built and published by cron on the web host itself
# (scripts/dreamhost-build.sh), because DreamHost's firewall intermittently
# drops SSH from GitHub's datacenter IPs and CISA answers them with a 403.
# This workflow's job is to catch a broken build before it reaches the host.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # A smoke build against live feeds. There is no cached state here, so
      # this also proves a cold start works, which is the one path the host
      # never exercises once its state file exists.
      - name: Build
        run: python plaintext.py --out-dir dist

      - name: Verify build
        run: python verify.py dist
